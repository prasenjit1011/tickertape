<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stocks · Tickertape</title>
  <link rel="stylesheet" href="/css/products.css">
  <link rel="stylesheet" href="/css/stocks.css?v=67">
</head>
<body class="stocks-page">
  <header class="topbar">
    
    
  </header>

  <main class="sheet">
    <div class="sheet-bar toolbar">
      <div class="bar-identity">
        <div class="brand">
          <span class="mark">SD</span>
          
          <h1>Stock Data</h1>
          <span id="status" class="status" role="status"></span>
        </div>
      </div>
      <div class="bar-controls">
        <label class="filter">
          <span class="sr-only">Filter table</span>
          <button type="button" class="search-icon" aria-label="Search" aria-expanded="false">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="7" cy="7" r="4.25" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5 13.5 13.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <input id="filter" type="search" placeholder="Filter name, ticker, sector">
          <button type="button" class="search-clear" aria-label="Clear search">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4.5 4.5 11.5 11.5M11.5 4.5 4.5 11.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </label>
        <div class="tool-group sync-cluster">
          <form id="sync-form" class="sync-form">
            <label class="sid-field">
              <span class="sr-only">Symbol</span>
              <input id="sid" name="sid" value="HYU" maxlength="12" required pattern="[A-Za-z0-9]+" spellcheck="false">
            </label>
            <button class="btn ghost" type="submit">Sync</button>
          </form>
        </div>
        <div class="tool-group" role="group" aria-label="Hide market caps">
          <div class="cap-toggle">
            
            <button id="hide-small" class="btn ghost icon-btn" type="button" aria-pressed="false">
              <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 8h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              Small
            </button>
            <button id="hide-mid" class="btn ghost icon-btn" type="button" aria-pressed="false">
              <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 8h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              Mid
            </button>
          </div>
        </div>


        <nav class="page-nav" aria-label="Pages">
          <button id="menu-toggle" class="btn ghost icon-btn menu-toggle" type="button" aria-expanded="false" aria-controls="page-menu" aria-haspopup="menu" aria-label="Menu">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <div id="page-menu" class="page-menu" role="menu" hidden>
            <button id="sync-all" class="menu-item" type="button" role="menuitem">Sync data</button>
            <button id="start-cron" class="menu-item" type="button" role="menuitem">Daily sync</button>
            <a class="menu-item" href="/portfolio.html" role="menuitem">Portfolio</a>
            <a class="menu-item" href="/products" role="menuitem">Products</a>
          </div>
        </nav>
      </div>
    </div>


    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr id="stock-heads"></tr>
        </thead>
        <tbody id="stock-rows"></tbody>
      </table>
    </div>


    <section id="yearly-panel" class="yearly-panel" hidden>
      <div class="yearly-bar">
        <div class="yearly-head">
          <div class="yearly-identity">
            <h2 id="yearly-title">Range</h2>
          </div>
          <dl class="yearly-stats">
            <div>
              <dt>Qty</dt>
              <dd id="yearly-qty">—</dd>
            </div>
            <div>
              <dt>Invested</dt>
              <dd id="yearly-invested">—</dd>
            </div>
            <div>
              <dt>Live P/L</dt>
              <dd id="yearly-live">—</dd>
            </div>
            <div>
              <dt>P/L %</dt>
              <dd id="yearly-pct">—</dd>
            </div>
            <div>
              <dt>LTP</dt>
              <dd id="yearly-price">—</dd>
            </div>
            <div>
              <dt>Avg buy</dt>
              <dd id="yearly-buy">—</dd>
            </div>
            <div>
              <dt>Avg sell</dt>
              <dd id="yearly-sell">—</dd>
            </div>
          </dl>
        </div>
        <button id="yearly-close" class="btn ghost" type="button">Close</button>
      </div>
      <div id="stock-details" class="stock-details"></div>
      <div class="range-grid">
        <div class="range-col">
          <div class="range-head">
            <h3 class="range-label">Yearly</h3>
            <button class="btn ghost icon-btn range-min" type="button" aria-expanded="true" aria-label="Minimize Yearly">
              <svg class="icon-min" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4 8h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <svg class="icon-max" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 4v8M4 8h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="yearly-wrap">
            <table class="yearly-table">
              <thead>
                <tr>
                  <th>Year</th>
                  <th class="num">Low</th>
                  <th class="num">High</th>
                  <th class="num">Low date</th>
                  <th class="num">High date</th>
                </tr>
              </thead>
              <tbody id="yearly-rows"></tbody>
            </table>
          </div>
        </div>
        <div class="range-col">
          <div class="range-head">
            <h3 class="range-label">Monthly</h3>
            <button class="btn ghost icon-btn range-min" type="button" aria-expanded="true" aria-label="Minimize Monthly">
              <svg class="icon-min" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4 8h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <svg class="icon-max" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 4v8M4 8h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="yearly-wrap">
            <table class="yearly-table">
              <thead>
                <tr>
                  <th>Month</th>
                  <th class="num">Low</th>
                  <th class="num">High</th>
                  <th class="num">Low date</th>
                  <th class="num">High date</th>
                </tr>
              </thead>
              <tbody id="monthly-rows"></tbody>
            </table>
          </div>
        </div>
        <div id="trade-col" class="range-col" hidden>
          <div class="range-head">
            <h3 class="range-label">Trades</h3>
            <button class="btn ghost icon-btn range-min" type="button" aria-expanded="true" aria-label="Minimize Trades">
              <svg class="icon-min" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4 8h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <svg class="icon-max" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 4v8M4 8h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="yearly-wrap">
            <table class="yearly-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Action</th>
                  <th class="num">Qty</th>
                  <th class="num">Price</th>
                  <th class="num">Value</th>
                </tr>
              </thead>
              <tbody id="trade-rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    
  </main>

  <script src="/js/stocks.js?v=58"></script>
</body>
</html>
