<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products · Tickertape</title>
  <link rel="stylesheet" href="/css/products.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark">TT</span>
      <div>
        <p class="eyebrow">Tickertape</p>
        <h1>Product ledger</h1>
      </div>
    </div>
    <div class="top-actions">
      <a class="btn ghost" href="/stocks">Stocks</a>
      <button id="new-product" class="btn primary" type="button">New product</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel list-panel">
      <div class="panel-head">
        <h2>Catalog</h2>
        <label class="search">
          <span class="sr-only">Search products</span>
          <input id="search" type="search" placeholder="Search SKU or name">
        </label>
      </div>
      <p id="status" class="status" role="status"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>SKU</th>
              <th>Name</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="product-rows"></tbody>
        </table>
      </div>
      <div class="pager">
        <button id="prev-page" class="btn ghost" type="button">Previous</button>
        <span id="page-label">Page 1</span>
        <button id="next-page" class="btn ghost" type="button">Next</button>
      </div>
    </section>

    <section class="panel form-panel" id="editor">
      <div class="panel-head">
        <h2 id="form-title">New product</h2>
        <button id="cancel-edit" class="btn ghost" type="button" hidden>Cancel</button>
      </div>
      <form id="product-form">
        <input id="product-id" type="hidden">
        <label>
          SKU
          <input id="sku" name="sku" required maxlength="80" autocomplete="off">
        </label>
        <label>
          Name
          <input id="name" name="name" required maxlength="200">
        </label>
        <label>
          Description
          <textarea id="description" name="description" maxlength="2000" rows="4"></textarea>
        </label>
        <div class="split">
          <label>
            Price
            <input id="price" name="price" type="number" min="0.01" step="0.01" required>
          </label>
          <label>
            Stock
            <input id="stock" name="stock" type="number" min="0" step="1" required>
          </label>
        </div>
        <p id="form-error" class="form-error" role="alert"></p>
        <button class="btn primary" type="submit">Save product</button>
      </form>
    </section>
  </main>

  <dialog id="delete-dialog">
    <form method="dialog">
      <h2>Delete product</h2>
      <p id="delete-copy">This product will be removed from the catalog.</p>
      <div class="dialog-actions">
        <button class="btn ghost" value="cancel" type="submit">Keep</button>
        <button id="confirm-delete" class="btn danger" value="confirm" type="submit">Delete</button>
      </div>
    </form>
  </dialog>

  <script src="/js/products.js"></script>
</body>
</html>
