name: Deploy Lambda

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the jar
        run: mvn -B -DskipTests package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Prepare Terraform state
        id: state
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="tickertape-tfstate-${ACCOUNT_ID}"
          LOCK="tickertape-tflock"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=${AWS_REGION}"
            fi
          fi
          aws s3api put-bucket-versioning --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket "$BUCKET" --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block --bucket "$BUCKET" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          if ! aws dynamodb describe-table --table-name "$LOCK" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws dynamodb create-table --table-name "$LOCK" --region "$AWS_REGION" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name "$LOCK" --region "$AWS_REGION"
          fi
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "lock=$LOCK" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Create the container registry
        working-directory: infra
        env:
          TF_VAR_image_uri: placeholder
          TF_VAR_mongodb_uri: ${{ secrets.MONGODB_URI_TICKERTAPE }}
          TF_VAR_create_lambda: "false"
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ steps.state.outputs.bucket }}" \
            -backend-config="key=lambda/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ steps.state.outputs.lock }}" \
            -backend-config="encrypt=true"
          terraform apply -input=false -auto-approve

      - name: Build and push the image
        id: image
        run: |
          set -euo pipefail
          REPOSITORY="$(terraform -chdir=infra output -raw ecr_repository_url)"
          REGISTRY="${REPOSITORY%%/*}"
          TAG="${GITHUB_SHA}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker build --tag "${REPOSITORY}:${TAG}" --tag "${REPOSITORY}:latest" .
          docker push "${REPOSITORY}:${TAG}"
          docker push "${REPOSITORY}:latest"
          echo "uri=${REPOSITORY}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Deploy the function
        working-directory: infra
        env:
          TF_VAR_image_uri: ${{ steps.image.outputs.uri }}
          TF_VAR_mongodb_uri: ${{ secrets.MONGODB_URI_TICKERTAPE }}
          TF_VAR_create_lambda: "true"
        run: terraform apply -input=false -auto-approve

      - name: Show the site URL
        working-directory: infra
        run: terraform output -raw function_url
